# ==========================
# nginx - app.cybermate.uz
# ==========================
#
# /etc/nginx/sites-available/app.cybermate.uz ga qo'ying,
# so'ng sites-enabled ga symlink qiling.
#
# Bu FAQAT app.cybermate.uz uchun alohida server bloki -
# serverdagi boshqa saytlarga tegmaydi.
#
# certbot ishga tushgach, u bu faylga SSL qatorlarini
# o'zi qo'shadi va 80-portni HTTPS ga yo'naltiradi.
# ==========================

server {
    listen 80;
    listen [::]:80;

    server_name app.cybermate.uz;

    # Telegram Mini App ichida ochilishi uchun
    # (Telegram sahifani iframe ichida ko'rsatadi)
    add_header X-Frame-Options "ALLOWALL" always;

    # yuklanadigan kvitansiya/hujjatlar uchun
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
