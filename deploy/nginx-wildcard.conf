# ==========================
# nginx - *.cybermate.uz (KO'P MAKTAB)
# ==========================
#
# Bitta blok BARCHA maktablarga xizmat qiladi. Yangi maktab
# qo'shilganda bu fayl O'ZGARMAYDI - faqat port jadvaliga
# bitta qator qo'shiladi:
#
#     /etc/nginx/school-ports.map
#     19bmsm.cybermate.uz 8000;
#     5mmm.cybermate.uz   8001;
#
# Shu tufayli yangi maktabga DNS yozuvi ham, alohida SSL
# sertifikat ham KERAK EMAS:
#
#   DNS   : *.cybermate.uz -> server IP   (bir marta)
#   SSL   : wildcard sertifikat           (bir marta, DNS-01)
#
# DIQQAT: wildcard sertifikat HTTP-01 bilan olinmaydi, faqat
# DNS-01 bilan. Domen provayderingizda DNS API bo'lishi kerak:
#
#   certbot certonly --manual --preferred-challenges dns \
#           -d "*.cybermate.uz" -d cybermate.uz
#
# Bu blok mavjud app.cybermate.uz ga TEGMAYDI - aniq nomli
# server bloki wildcard'dan doim ustun turadi, shuning uchun
# 19-BMSM eski manzilida ishlayveradi.
# ==========================


# Subdomen -> port jadvali. Faylni new_school.sh to'ldiradi.
# `hostnames` - nuqtali nomlarni to'g'ri solishtirish uchun.

map $host $school_port {

    hostnames;

    default 0;

    include /etc/nginx/school-ports.map;
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name *.cybermate.uz;

    ssl_certificate     /etc/letsencrypt/live/cybermate.uz-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybermate.uz-wildcard/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # yuklanadigan kvitansiya/hujjatlar uchun
    client_max_body_size 25M;

    access_log /var/log/nginx/schools-access.log;
    error_log  /var/log/nginx/schools-error.log;

    # Jadvalda yo'q subdomen - bunday maktab yo'q.
    # Bo'lmasa nginx 502 berardi va sabab tushunarsiz bo'lardi.

    if ($school_port = 0) {
        return 404 "Bunday maktab topilmadi";
    }

    location / {
        proxy_pass http://127.0.0.1:$school_port;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}


server {
    listen 80;
    listen [::]:80;

    server_name *.cybermate.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
