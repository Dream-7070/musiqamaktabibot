# ==========================
# nginx - app.cybermate.uz
# ==========================
#
# Bu FAQAT app.cybermate.uz uchun alohida server bloki -
# serverdagi boshqa saytlarga (cybermate.uz, aifabric.uz,
# alphior.uz, protsess.uz, thermotrade.uz) tegmaydi.
#
# SSL sertifikat allaqachon mavjud (certbot bilan olingan),
# shuning uchun uni to'g'ridan-to'g'ri ishlatamiz.
# ==========================


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name app.cybermate.uz;

    ssl_certificate     /etc/letsencrypt/live/app.cybermate.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cybermate.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # yuklanadigan kvitansiya/hujjatlar uchun
    client_max_body_size 25M;

    access_log /var/log/nginx/app.cybermate.uz-access.log;
    error_log  /var/log/nginx/app.cybermate.uz-error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}


server {
    listen 80;
    listen [::]:80;

    server_name app.cybermate.uz;

    # Let's Encrypt yangilanishi uchun ochiq qoldiriladi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
